# Application Name
spring.application.name=gestion-stock-tricol

# Server Configuration
server.port=8080

# Database MySQL - Uses environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/gestionstock?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Casablanca}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tricol_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tricol_pass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.url=${SPRING_LIQUIBASE_URL:jdbc:mysql://mysql:3306/gestionstock?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Casablanca}
spring.liquibase.user=${SPRING_LIQUIBASE_USER:tricol_user}
spring.liquibase.password=${SPRING_LIQUIBASE_PASSWORD:tricol_pass123}
spring.liquibase.driver-class-name=com.mysql.cj.jdbc.Driver

# Jackson (JSON)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Casablanca

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.com.tricol.gestionstock=${LOGGING_LEVEL_COM_TRICOL_GESTIONSTOCK:DEBUG}
logging.level.com.tricol.gestionstock.security=DEBUG
logging.level.com.tricol.gestionstock.service.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:WARN}
logging.level.liquibase=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With,Cache-Control
app.cors.allow-credentials=true
app.cors.max-age=3600

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Keycloak Configuration
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080}
keycloak.realm=${KEYCLOAK_REALM:gestion-stock-realm}

# Spring Security OAuth2 Resource Server (for Keycloak JWT validation)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:gestion-stock-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:gestion-stock-realm}/protocol/openid-connect/certs

