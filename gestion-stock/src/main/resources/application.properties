# Application
spring.application.name=gestion-stock-tricol
server.port=8080

# Database MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestionstock?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=adiladil123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.url=jdbc:mysql://localhost:3306/gestionstock?allowPublicKeyRetrieval=true&useSSL=false
spring.liquibase.user=root
spring.liquibase.password=adiladil123
spring.liquibase.driver-class-name=com.mysql.cj.jdbc.Driver
# Jackson (JSON)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Casablanca

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.com.tricol.gestionstock=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.liquibase=INFO

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Cors
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With,Cache-Control
app.cors.allow-credentials=true




