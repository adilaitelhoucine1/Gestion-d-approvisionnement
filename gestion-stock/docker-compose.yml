version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: gestion-stock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-adiladil123}
      MYSQL_DATABASE: ${DB_NAME:-gestionstock}
      MYSQL_USER: ${DB_USER:-adil}
      MYSQL_PASSWORD: ${DB_PASSWORD:-adiladil123}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - gestion-stock-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-adiladil123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion-stock-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-gestionstock}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Casablanca
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD:-adiladil123}

      # Liquibase Configuration
      SPRING_LIQUIBASE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-gestionstock}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Casablanca
      SPRING_LIQUIBASE_USER: root
      SPRING_LIQUIBASE_PASSWORD: ${DB_ROOT_PASSWORD:-adiladil123}

      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${JPA_FORMAT_SQL:-true}

      # Application Configuration
      SERVER_PORT: 8080

      # JWT Configuration
      APP_JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
      APP_JWT_EXPIRATION_MS: ${JWT_EXPIRATION:-86400000}
      APP_JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION:-604800000}

      # CORS Configuration
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4200,http://localhost:5173}

      # Logging
      LOGGING_LEVEL_COM_TRICOL_GESTIONSTOCK: ${LOG_LEVEL:-INFO}
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: ${SQL_LOG_LEVEL:-WARN}

      # Timezone
      TZ: Africa/Casablanca
      JAVA_OPTS: "-Xms512m -Xmx1024m -Duser.timezone=Africa/Casablanca"
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - gestion-stock-network
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # phpMyAdmin (Optional - for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gestion-stock-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-adiladil123}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - gestion-stock-network

networks:
  gestion-stock-network:
    driver: bridge
    name: gestion-stock-network

volumes:
  mysql_data:
    name: gestion-stock-mysql-data
  app_logs:
    name: gestion-stock-app-logs

